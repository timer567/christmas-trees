<div class="c-scene">
<canvas id="christmas-canvas" aria-label="点击地面礼盒，打开祝福和彩花"></canvas>
<div class="c-gift-message" id="gift-message-warm" aria-live="polite"><strong>一份冬日温暖</strong><span>愿你的冬天被温柔与惊喜环绕。</span><small class="c-poem-source" hidden></small></div>
<div class="c-gift-message" id="gift-message-joy" aria-live="polite"><strong>一份节日喜悦</strong><span>愿所有美好，如约而至。</span><small class="c-poem-source" hidden></small></div>
</div>
<main class="c-copy"><p class="c-kicker">A little Christmas magic</p><h1 class="c-title">Merry<br>Christmas</h1><span class="c-rule"></span><p class="c-message">愿这个冬日<br>有温暖，也有惊喜。</p><p class="c-signoff">轻触礼盒 · 拆开一份祝福</p></main>
<audio id="christmas-track" preload="none" loop src="music/祝你圣诞快乐.mp3"></audio>
<div class="c-controls">
<button class="c-control-button c-music" type="button" aria-pressed="false">开启配乐</button>
<div class="c-track"><button class="c-control-button c-track-trigger" type="button" aria-expanded="false" aria-controls="music-options">切换配乐 <span class="c-list-icon" aria-hidden="true"><i></i><i></i><i></i></span></button><div id="music-options" class="c-song-list" role="group" aria-label="选择圣诞乐曲" hidden><button type="button" data-track="0" aria-pressed="true">祝你圣诞快乐</button><button type="button" data-track="1" aria-pressed="false">铃儿响叮当</button><button type="button" data-track="2" aria-pressed="false">胡桃夹子·糖梅仙子</button></div></div>
</div>

<script src="./movie-quotes.js"></script>
<script src="./expanded-literature.js"></script>
<script src="./expanded-movies.js"></script>
<script>
    (() => {
      const root=document.getElementById('christmas-greeting-preview'),canvas=root.querySelector('#christmas-canvas'),ctx=canvas.getContext('2d'),musicButton=root.querySelector('.c-music'),giftMessages={warm:root.querySelector('#gift-message-warm'),joy:root.querySelector('#gift-message-joy')};let frame,paused=false,width=0,height=0,dpr=1,openedGifts={warm:false,joy:false};const confetti=[];
      let snowPointer=null;
      const updateSnowPointer=event=>{const bounds=canvas.getBoundingClientRect();snowPointer={x:(event.clientX-bounds.left)*700/bounds.width,y:(event.clientY-bounds.top)*520/bounds.height}};
      canvas.addEventListener('pointermove',updateSnowPointer);
      canvas.addEventListener('pointerdown',updateSnowPointer);
      canvas.addEventListener('pointerleave',()=>{snowPointer=null});
      canvas.addEventListener('pointercancel',()=>{snowPointer=null});
      canvas.addEventListener('pointerup',event=>{if(event.pointerType!=='mouse')snowPointer=null});
      const lidSurface=kind=>{const left=kind==='warm',lift=giftMotion[kind].value;return{cx:(left?118:567)-7*lift,cy:(left?427:414)-48*lift,angle:-.16*lift,half:left?50:51}};
      const lidPosition=(surface,localX)=>({x:surface.cx+localX*Math.cos(surface.angle),y:surface.cy+localX*Math.sin(surface.angle)-1});
      const snowState=(flake,time,now,pointer,radius)=>{
        const distance=flake.y*520+time*flake.speed,cycle=Math.floor(distance/570);
        if(flake.cycle!==cycle){flake.cycle=cycle;flake.meltAt=null;flake.landed=null;flake.previous=null}
        let x=flake.x*700+Math.sin(time*.55+flake.phase)*15,y=(distance%570)-25;
        if(!flake.landed&&flake.canLand&&flake.meltAt==null&&flake.previous){
          for(const kind of ['warm','joy']){
            const surface=lidSurface(kind),cos=Math.cos(surface.angle),sin=Math.sin(surface.angle);
            const localX=(x-surface.cx)*cos+(y-surface.cy)*sin;
            const localY=-(x-surface.cx)*sin+(y-surface.cy)*cos;
            const previousY=-(flake.previous.x-surface.cx)*sin+(flake.previous.y-surface.cy)*cos;
            if(previousY<0&&localY>=0&&Math.abs(localX)<surface.half-4){
              flake.landed={kind,localX,at:now,rotation:time*.25+flake.spin};break
            }
          }
        }
        flake.previous={x,y};
        if(flake.landed){
          const landed=flake.landed,point=lidPosition(lidSurface(landed.kind),landed.localX);
          x=point.x;y=point.y;
          if(flake.meltAt==null&&pointer&&Math.hypot(x-pointer.x,y-pointer.y)<radius+flake.size)flake.meltAt=now;
          const naturalProgress=Math.min(1,Math.max(0,(now-landed.at-450)/2100));const naturalMelt=naturalProgress*naturalProgress*(3-2*naturalProgress);
          const touchedMelt=flake.meltAt==null?0:Math.min(1,(now-flake.meltAt)/650);
          return{x,y,melt:Math.max(naturalMelt,touchedMelt),rotation:landed.rotation,sizeScale:1}
        }
        if(flake.meltAt==null&&pointer&&Math.hypot(x-pointer.x,y-pointer.y)<radius+flake.size)flake.meltAt=now;
        const melt=flake.meltAt==null?0:Math.min(1,(now-flake.meltAt)/650);
        return{x,y,melt,rotation:time*.25+flake.spin,sizeScale:1}
      };
      const snow=Array.from({length:48},(_,i)=>({x:(i*67%701)/700,y:(i*113%550)/520,size:4+(i%4)*1.3,speed:14+(i%6)*7,phase:i*.84,spin:i*.27,canLand:i%3===0}));const color=(()=>{const cache=new Map();return name=>{if(!cache.has(name))cache.set(name,getComputedStyle(root).getPropertyValue(name).trim());return cache.get(name)}})();const curve=(a,b,c,t)=>({x:(1-t)**2*a.x+2*(1-t)*t*b.x+t*t*c.x,y:(1-t)**2*a.y+2*(1-t)*t*b.y+t*t*c.y});
      const polygon=(points,fill)=>{ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()};
      const snowflake=(x,y,s,r,ink,opacity=1)=>{ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.strokeStyle=ink;ctx.globalAlpha=.66*opacity;ctx.lineWidth=Math.max(1,s/6);ctx.lineCap='round';for(let arm=0;arm<6;arm++){ctx.save();ctx.rotate(arm*Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s);ctx.moveTo(0,-s*.57);ctx.lineTo(s*.24,-s*.78);ctx.moveTo(0,-s*.57);ctx.lineTo(-s*.24,-s*.78);ctx.stroke();ctx.restore()}ctx.restore()};
      const bulb=(x,y,ink,time,i)=>{ctx.save();const pulse=.9+.1*Math.sin(time*.9+i*.35);const reflected=ctx.createRadialGradient(x,y,1,x,y,15);reflected.addColorStop(0,ink);reflected.addColorStop(1,'rgba(223,193,139,0)');ctx.globalAlpha=.13*pulse;ctx.fillStyle=reflected;ctx.fillRect(x-15,y-15,30,30);ctx.globalAlpha=.88*pulse;ctx.shadowBlur=5;ctx.shadowColor=ink;ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x,y,3.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.55;ctx.shadowBlur=0;ctx.fillStyle='#fff7df';ctx.beginPath();ctx.arc(x-.9,y-1, .75,0,Math.PI*2);ctx.fill();ctx.restore()};
      const garlandCache=new Map();
      const garland=(a,b,c,inks,time,offset)=>{
        ctx.save();ctx.strokeStyle='#8e9366';ctx.globalAlpha=.4;ctx.lineWidth=.85;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(b.x,b.y,c.x,c.y);ctx.stroke();ctx.restore();
