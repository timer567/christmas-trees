<style>
:root {
  --site-primary: #1d7545;
  --site-secondary: #d8f5df;
  --site-background: #050907;
  --site-on-primary: #ffffff;
  --site-on-secondary: #153d27;
  --site-on-background: #f7fff8;
  --site-font-body: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --site-font-heading: "Brush Script MT", "Segoe Script", cursive;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100svh; width: 100%; overflow: clip; position: relative; display: grid; place-items: center; background-color: var(--site-background); color: var(--site-on-background); isolation: isolate; border-radius: 0; }
#app::before { content:""; position:absolute; z-index:-1; inset:-12%; pointer-events:none; background:radial-gradient(ellipse at 50% 78%,#174b32 0%,transparent 43%),radial-gradient(ellipse at 18% 28%,#174c3b88 0%,transparent 42%),linear-gradient(180deg,#061b1c 0%,#0b211c 55%,#020806 100%); transition:background 1.8s ease,filter 1.8s ease; }
#app::after { content:"✦　　❄　　 ✧　　　　 ❄　　　✦"; position:absolute; z-index:0; inset:12% 0 auto; height:45%; text-align:center; color:#e9fff0aa; font-size:clamp(18px,4vw,34px); letter-spacing:1.4em; pointer-events:none; text-shadow:0 0 18px currentColor; opacity:.35; animation:ambientDrift 16s ease-in-out infinite alternate; transition:color 1.5s,opacity 1.5s; }
@keyframes ambientDrift { to { transform:translateY(24px); opacity:.7; } }
#app.theme-jingle::before { background:radial-gradient(ellipse at 50% 75%,#a64b1e 0%,transparent 42%),radial-gradient(ellipse at 18% 22%,#315d8b 0%,transparent 46%),linear-gradient(180deg,#102c50 0%,#17395a 52%,#101b2e 100%); }
#app.theme-jingle::after { color:#ffe9a0; opacity:.62; }
#app.theme-wewish::before { background:radial-gradient(ellipse at 50% 80%,#a72d35 0%,transparent 43%),radial-gradient(ellipse at 80% 22%,#1e805b99 0%,transparent 45%),linear-gradient(180deg,#123c35 0%,#183c35 52%,#101d25 100%); }
#app.theme-wewish::after { content:"🎁　　 ✨　　 🎄　　 ✨　　 🎁"; color:#ffe7bb; opacity:.58; letter-spacing:.65em; }
#app.theme-deck::before { background:radial-gradient(ellipse at 50% 75%,#a65a20 0%,transparent 42%),radial-gradient(ellipse at 50% 20%,#8d4b1e77 0%,transparent 48%),linear-gradient(180deg,#3c251e 0%,#39291e 52%,#130f0c 100%); }
#app.theme-deck::after { content:"🕯　　 ✨　　 🕯　　 ✨　　 🕯"; color:#ffd58a; opacity:.55; }
#app.theme-silent::before { background:radial-gradient(ellipse at 50% 75%,#244e83 0%,transparent 44%),radial-gradient(ellipse at 82% 18%,#a9d9ff55 0%,transparent 34%),linear-gradient(180deg,#07152f 0%,#102b50 54%,#050d20 100%); }
#app.theme-silent::after { content:"☾　　 ✧　　 ❄　　 ✧　　 ☾"; color:#d8edff; opacity:.52; }
.scene { width: min(100%, 760px); min-height: 100svh; position: relative; display: flex; flex-direction: column; align-items: center; padding: 34px 16px 24px; }
.stars, .snow { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: var(--site-decoration-opacity); }
.star { position: absolute; width: var(--size); height: var(--size); border-radius: 50%; background: #fff9d7; box-shadow: 0 0 9px 3px #fff8c977, 0 0 24px 6px #dfffe855; animation: twinkle var(--duration) ease-in-out infinite alternate; }
.star.cross::before, .star.cross::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 4px; box-shadow: 0 0 8px #fff; }
.star.cross::before { width: 1.5px; height: 26px; } .star.cross::after { width: 26px; height: 1.5px; }
@keyframes twinkle { to { opacity: .28; transform: scale(.55); } }
.snowflake { position: absolute; top: -20px; color: white; text-shadow: 0 0 8px white; animation: snowfall var(--duration) linear infinite; }
#app.theme-jingle .snowflake { color:#fff0bd; text-shadow:0 0 10px #ffe8a5; }
#app.theme-wewish .snowflake { color:#ffe5e5; text-shadow:0 0 10px #ffb4a5; }
#app.theme-deck .snowflake { color:#ffdda0; text-shadow:0 0 10px #ffb85c; }
#app.theme-silent .snowflake { color:#c8e8ff; text-shadow:0 0 12px #9dcfff; }
@keyframes snowfall { to { transform: translate(var(--drift), 110vh) rotate(300deg); opacity: .1; } }
.heading { z-index: 3; text-align: center; text-shadow: 0 0 8px white, 0 0 25px #d8ffc8; }
.script { font-family: var(--site-font-heading); font-size: clamp(46px, 10vw, 76px); line-height: .9; font-style: italic; letter-spacing: -2px; color: #fffef0; }
.subtitle { margin-top: 13px; font-size: 10px; letter-spacing: .42em; color: #dff7e4; opacity: .8; }
.stage { z-index: 2; width: min(94vw, 560px); height: min(66vh, 570px); min-height: 410px; position: relative; display: grid; place-items: center; perspective: 1000px; perspective-origin: 50% 43%; touch-action: pan-y; cursor: grab; }
.stage:active { cursor: grabbing; }
.world { width: 300px; height: 420px; position: relative; transform-style: preserve-3d; transform: rotateX(-8deg) rotateY(-24deg); transition: transform .15s ease-out; }
.auto .world { animation: gentleTurn 18s ease-in-out infinite; }
@keyframes gentleTurn { 0%,100% { transform: rotateX(-8deg) rotateY(-22deg); } 50% { transform: rotateX(-5deg) rotateY(22deg); } }
.tree3d { position: absolute; inset: 0; transform-style: preserve-3d; }
.trunk { position: absolute; width: 58px; height: 105px; left: 121px; bottom: -14px; transform: translateZ(0); border-radius: 8px 8px 13px 13px; background: linear-gradient(90deg,#713014,#d66a31 35%,#9b3d1c 72%,#51200f); box-shadow: 12px 12px 18px #0009; }
.tier { position: absolute; left: 50%; bottom: var(--bottom); width: var(--width); height: var(--height); margin-left: calc(var(--width) / -2); transform-style: preserve-3d; transform: translateZ(var(--z)); }
.cone { position: absolute; inset: 0; clip-path: polygon(50% 0%, 100% 100%, 0% 100%); border-radius: 12px; background: linear-gradient(100deg,#06391f 0%,#08733b 18%,#42c66d 42%,#83ef91 53%,#219c50 76%,#063b22 100%); filter: drop-shadow(7px 9px 5px #0008); }
.cone::after { content:""; position:absolute; left: 8%; right: 8%; bottom: 8%; height: 18%; border-radius: 50%; background: linear-gradient(90deg,#0c522d,#8ef29a 45%,#17683a); filter: blur(7px); opacity:.8; }
.tier::before { content:""; position:absolute; inset: 4% 0 0; clip-path: polygon(50% 0,100% 100%,0 100%); transform: translateZ(-24px); background: linear-gradient(90deg,#032b19,#0b5b31 55%,#021e12); filter: brightness(.75); }
.snow-rim { position:absolute; left: 8%; right: 8%; bottom: -1%; height: 14%; border-radius: 50%; border-bottom: 8px solid #f5fff6; border-left: 3px solid #effff3; border-right: 3px solid #effff3; transform: rotateX(66deg) translateZ(8px); filter: drop-shadow(0 0 5px white); opacity:.95; }
.t1 { --width: 118px; --height: 140px; --bottom: 276px; --z: 16px; }
.t2 { --width: 190px; --height: 168px; --bottom: 198px; --z: 10px; }
.t3 { --width: 250px; --height: 190px; --bottom: 112px; --z: 3px; }
.t4 { --width: 306px; --height: 204px; --bottom: 18px; --z: -8px; }
.bulb { position:absolute; width: 13px; height: 13px; border-radius:50%; background: radial-gradient(circle at 30% 25%,#fff 0 8%,#fff6bb 15%,#f4c95e 43%,#9a591a 100%); box-shadow: 0 0 8px 3px #fff5a5; transform: translateZ(13px); opacity: .15; transition: opacity 1.2s, box-shadow 1.2s; }
.bulb:nth-child(3n) { --bulb-color:#ff5577; --bulb-glow:#ff5577; }
.bulb:nth-child(3n + 1) { --bulb-color:#5de6ff; --bulb-glow:#5de6ff; }
.bulb:nth-child(3n + 2) { --bulb-color:#ffe36e; --bulb-glow:#ffe36e; }
@keyframes bulbBreathe { 0%,100% { opacity:.62; filter:brightness(.85); box-shadow:0 0 7px 2px var(--bulb-glow,#ffe36e); } 50% { opacity:1; filter:brightness(1.55); box-shadow:0 0 17px 7px var(--bulb-glow,#ffe36e),0 0 28px 10px color-mix(in srgb,var(--bulb-glow,#ffe36e) 45%,transparent); } }
.b1 { left: 48%; top: 32%; } .b2 { left: 30%; top: 55%; } .b3 { left: 66%; top: 58%; } .b4 { left: 20%; top: 68%; } .b5 { left: 76%; top: 73%; } .b6 { left: 40%; top: 80%; } .b7 { left: 57%; top: 88%; }
.star-top { position:absolute; left: 50%; top: -31px; width: 48px; height: 48px; margin-left:-24px; transform: translateZ(34px); opacity:.2; transition: opacity 1s; filter: drop-shadow(0 0 10px #fff8b0); }
.star-top::before { content:"✦"; display:block; color:#fff7bf; font-size:48px; text-align:center; }
.light-string { position:absolute; inset: 12% 8% 8%; border: 2px dotted #fff9c9; border-radius: 48%; transform: translateZ(17px); opacity:0; filter: drop-shadow(0 0 7px white); transition: opacity 1.5s; }
.snow-ground { position:absolute; bottom: 0; left: 50%; width: 390px; height: 92px; margin-left:-195px; border-radius:50%; transform: rotateX(68deg) translateZ(-36px); background: radial-gradient(ellipse,#fff 0%,#eafff0 28%,#d8f8e4 46%,transparent 72%); filter: blur(8px); opacity:.7; }
.flake { position:absolute; z-index:3; top:55%; left:50%; font-size:90px; color:white; text-shadow:0 0 12px white; opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(-40deg); transition:all 1.5s ease 1.3s; pointer-events:none; }
.tree-treasure { position:absolute; z-index:6; font-size:30px; line-height:1; cursor:pointer; user-select:none; filter:drop-shadow(0 3px 5px #000b) drop-shadow(0 0 8px #ffe7a0aa); opacity:0; transform:translateY(12px) scale(.7); transition:opacity 1s ease 1.8s,transform 1s cubic-bezier(.2,.8,.2,1) 1.8s; animation:treasureBob 3s ease-in-out infinite; }
.tree-treasure:focus-visible { outline:2px solid #fff3c4; outline-offset:5px; border-radius:8px; }
.treasure-a { left:10%; bottom:13%; }.treasure-b { right:9%; bottom:17%; animation-delay:.5s; }.treasure-c { left:23%; bottom:4%; font-size:25px; animation-delay:1s; }.treasure-d { right:23%; bottom:5%; font-size:25px; animation-delay:1.4s; }
.treasure-note { position:absolute; z-index:7; left:50%; bottom:1%; transform:translate(-50%,10px); width:max-content; max-width:90%; padding:8px 13px; border:1px solid #f4dfad88; border-radius:20px; background:#07160fe8; color:#fff0c8; font-size:11px; letter-spacing:.06em; opacity:0; pointer-events:none; transition:opacity .35s,transform .35s; }
.treasure-note.show { opacity:1; transform:translate(-50%,0); }
@keyframes treasureBob { 50% { translate:0 -7px; } }
.greeting { z-index:4; text-align:center; opacity:0; transform:translateY(12px); transition:all 1s ease 2s; text-shadow:0 0 16px #c8ffd9; min-height:75px; }
.greeting h2 { margin:0 0 8px; font-size:clamp(22px,5vw,29px); font-weight:500; letter-spacing:.12em; }
.greeting p { margin:0; color:#e1f8e7; font-size:12px; line-height:1.8; letter-spacing:.06em; }
.controls { z-index:5; display:flex; align-items:center; gap:12px; margin-top:auto; padding-top:12px; }
button { border:1px solid #e7ffe6aa; border-radius:999px; padding:12px 24px; background:#ffffff12; color:#f7fff7; font:inherit; letter-spacing:.13em; cursor:pointer; backdrop-filter:blur(10px); box-shadow:0 0 24px #baffcb22; }
button:hover { background:#dfffe629; }
.music-select { border:1px solid #e7ffe6aa; border-radius:999px; padding:11px 14px; background:#102318; color:#f7fff7; font:inherit; font-size:12px; letter-spacing:.04em; outline:none; }
.music-select option { background:#102318; color:#f7fff7; }
.note { z-index:2; margin-top:12px; font-size:10px; letter-spacing:.12em; color:#d6e8d9aa; }
.gift-intro { position:absolute; z-index:20; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 42%,#173c2a 0%,#07140e 48%,#020504 100%); transition:opacity 1.1s ease,visibility 1.1s ease; }
.gift-intro.opened { opacity:0; visibility:hidden; pointer-events:none; }
.gift-content { text-align:center; max-width:340px; }
.gift-kicker { color:#e7d5a1; font-size:10px; letter-spacing:.42em; margin-bottom:26px; }
.gift-box { position:relative; width:148px; height:118px; margin:0 auto 34px; cursor:pointer; filter:drop-shadow(0 18px 24px #000b); animation:giftFloat 3s ease-in-out infinite; }
.gift-base { position:absolute; left:9px; right:9px; bottom:0; height:82px; background:linear-gradient(100deg,#7c1828,#c63d49 48%,#761525); border:1px solid #f2c879; border-radius:5px 5px 10px 10px; }
.gift-lid { position:absolute; z-index:2; left:0; top:20px; width:148px; height:27px; border:1px solid #f8d98e; border-radius:5px; background:linear-gradient(90deg,#8c1d2b,#d94b55,#861b2a); transform-origin:12% 100%; transition:transform .9s cubic-bezier(.2,.8,.2,1); }
.gift-ribbon { position:absolute; z-index:3; left:65px; top:20px; bottom:0; width:19px; background:linear-gradient(90deg,#d5ad62,#fff0b7,#b8873e); }
.gift-bow { position:absolute; z-index:4; top:0; left:48px; width:52px; height:28px; }
.gift-bow:before,.gift-bow:after { content:""; position:absolute; width:27px; height:19px; border:5px solid #f2d18c; border-radius:80% 80% 10% 80%; }
.gift-bow:before { left:0; transform:rotate(22deg); }.gift-bow:after { right:0; transform:scaleX(-1) rotate(22deg); }

.gift-title { color:#fff8e6; font-family:var(--site-font-heading); font-size:clamp(32px,8vw,45px); font-style:italic; text-shadow:0 0 20px #e7c87988; }
.gift-copy { color:#d8e9d9; font-size:12px; letter-spacing:.12em; margin:12px 0 24px; }
.gift-open { border:1px solid #e7d19a; color:#fff2cf; background:#ffffff0d; padding:12px 28px; }
@keyframes giftFloat { 50% { transform:translateY(-9px) rotate(1deg); } }
#app.lit .bulb { opacity:1; background:radial-gradient(circle at 30% 25%,#fff 0 8%,#fff 15%,var(--bulb-color,#ffe36e) 48%,color-mix(in srgb,var(--bulb-color,#ffe36e) 55%,#321b18) 100%); animation:bulbBreathe 2.2s ease-in-out infinite; }
#app.theme-jingle .bulb { --bulb-color:#ffd36a; --bulb-glow:#ffb938; }

function setRotation(){treeView.rx=rx;treeView.ry=ry;}
scene.addEventListener('pointerdown',e=>{
 if(e.target.closest('[role="button"],button,select,input,a')||activePointer!==null||!e.isPrimary||e.button!==0)return;
 dragging=true;activePointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;
 rx=treeView.rx;
 ry=treeView.ry;
 app.classList.remove('auto');setRotation();scene.setPointerCapture(e.pointerId);
});
scene.addEventListener('pointermove',e=>{
 if(!dragging||e.pointerId!==activePointer)return;
 ry+=(e.clientX-lastX)*.45;
 rx=Math.max(-12,Math.min(4,rx+(e.clientY-lastY)*.25));
 lastX=e.clientX;lastY=e.clientY;setRotation();
});
function endDrag(e){if(e.pointerId===activePointer){dragging=false;activePointer=null;}}
scene.addEventListener('pointerup',endDrag);
scene.addEventListener('pointercancel',endDrag);
scene.addEventListener('lostpointercapture',endDrag);

let wishGlowTimer;
document.getElementById('light').addEventListener('click',()=>{
 const button=document.getElementById('light');
 button.classList.remove('wishing');void button.offsetWidth;button.classList.add('wishing');
 clearTimeout(wishGlowTimer);wishGlowTimer=setTimeout(()=>button.classList.remove('wishing'),1200);
 app.classList.add('lit');sendLuckyWishes();
});
document.getElementById('reset').addEventListener('click',()=>{ry=-24;rx=-8;setRotation();app.classList.add('auto');});

function burstStars(origin){
 const burst=document.createElement('div');burst.className='burst';burst.setAttribute('aria-hidden','true');
 if(origin){burst.style.setProperty('--burst-x',origin.x+'px');burst.style.setProperty('--burst-y',origin.y+'px');}
 for(let i=0;i<38;i++){
  const spark=document.createElement('span');spark.className='spark';spark.textContent=i%3?'✦':'·';
  const angle=Math.random()*Math.PI*2,reach=90+Math.random()*280;
  spark.style.setProperty('--dx',Math.cos(angle)*reach+'px');
  spark.style.setProperty('--dy',Math.sin(angle)*reach+'px');
  spark.style.setProperty('--spin',Math.random()*360+'deg');
  spark.style.setProperty('--size',8+Math.random()*15+'px');
  spark.style.setProperty('--wait',Math.random()*.25+'s');
  burst.appendChild(spark);
 }
 document.body.appendChild(burst);setTimeout(()=>burst.remove(),2300);
}


const luckyWishes=[
 '愿你所盼皆如愿，所行皆坦途',
 '好运正在向你奔来',
 '愿你平安喜乐，万事胜意',
 '愿你的努力，都有温柔的回响',
 '新的一年，好事接二连三',
 '愿你被爱包围，也被幸运偏爱',
 '愿你逢考必过，所求皆得',
 '把烦恼清零，把快乐装满',
 '愿你钱包鼓鼓，心情闪闪发光',
 '愿每一个明天，都有小小的惊喜',
 '愿你一路生花，自在明亮',
 '愿你健康常伴，幸福常在',
 '所有美好，都在赶来的路上',
 '愿你有勇气出发，也有好运相随',
 '愿你抬头遇见星光，转身遇见温暖',
 '这一次，幸运一定站在你这边'
];

let wishPool=luckyWishes.map((text,index)=>({id:'generated-'+index,text,origin:'generated'}));
let lastWishText='';
const wishesReady=fetch('./祝福素材库.json')
 .then(response=>{if(!response.ok)throw new Error('Wish library HTTP '+response.status);return response.json();})
 .then(library=>{
  if(!Array.isArray(library.items))throw new Error('Invalid wish library');
  const seen=new Set(wishPool.map(item=>item.text));
  for(const item of library.items){
   if(typeof item.text!=='string'||!item.text.trim()||seen.has(item.text.trim()))continue;
   const text=item.text.trim();seen.add(text);
   wishPool.push({id:item.id,text,origin:'collected',sourceId:item.source_id});
  }
 })
 .catch(()=>{/* Local generated wishes remain available if the library cannot load. */});
function pickLuckyWish(){
 const available=wishPool.filter(item=>item.text!==lastWishText);
 const chosen=available[Math.floor(Math.random()*available.length)]||wishPool[0];
 lastWishText=chosen.text;return chosen;
}

const danmaku=document.createElement('div');
danmaku.className='wish-danmaku';danmaku.setAttribute('aria-hidden','true');
document.body.appendChild(danmaku);
// Far wishes sit between the sky and the existing tree canvas; the tree masks them naturally.
const distantDanmaku=document.createElement('div');
distantDanmaku.className='wish-danmaku distant-wishes';distantDanmaku.setAttribute('aria-hidden','true');
app.appendChild(distantDanmaku);
const wishStatus=document.createElement('div');
wishStatus.className='wish-status';wishStatus.setAttribute('role','status');
document.querySelector('.controls').appendChild(wishStatus);

const trailLayer=document.createElement('div');
trailLayer.className='meteor-trail-layer';trailLayer.setAttribute('aria-hidden','true');
document.body.appendChild(trailLayer);
const distantTrailLayer=document.createElement('div');
distantTrailLayer.className='meteor-trail-layer distant-wishes';distantTrailLayer.setAttribute('aria-hidden','true');
app.appendChild(distantTrailLayer);
function leaveMeteorTrail(line,anchor){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const layer=line.dataset.depth==='far'?distantTrailLayer:trailLayer;
 let lastTrace=0;
 function paint(time){
  if(!line.isConnected)return;
  if(time-lastTrace>65){
   lastTrace=time;
   const box=anchor.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2;
   if(x>-75&&x<innerWidth&&y>0&&y<innerHeight&&layer.childElementCount<200){
    const trace=document.createElement('i');trace.className='meteor-trace';
    trace.style.left=x+'px';trace.style.top=y+'px';
    trace.style.scale=line.dataset.distanceScale||'1';
    layer.appendChild(trace);
    trace.addEventListener('animationend',()=>trace.remove(),{once:true});
    setTimeout(()=>trace.remove(),900);
   }
  }
  requestAnimationFrame(paint);
 }
 requestAnimationFrame(paint);
}

let laneReady=[],wishCursor=0,wishBatch=0;
async function sendLuckyWishes(){
 await wishesReady;
 if(danmaku.childElementCount+distantDanmaku.childElementCount>=24)return;
 const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const box=stage.getBoundingClientRect();
 const top=Math.max(84,Math.min(innerHeight*.2,box.top));
 const bottom=Math.max(top+100,Math.min(innerHeight-145,box.bottom-30));
 const lanes=Math.max(2,Math.min(6,Math.floor((bottom-top)/48)));
 const now=performance.now();
 if(reduced){danmaku.replaceChildren();distantDanmaku.replaceChildren();}
 const lane=wishCursor++%lanes,chosen=pickLuckyWish();
 const line=document.createElement('span');line.className='danmaku-line';
 const far=!reduced&&Math.random()<.3,distanceScale=far?.7+Math.random()*.12:1+Math.random()*.08;
 line.dataset.depth=far?'far':'near';line.dataset.distanceScale=String(distanceScale);
 line.style.setProperty('--distance-scale',String(distanceScale));
 const text=document.createElement('span');text.className='meteor-wish-text';text.textContent=chosen.text;
 line.appendChild(text);
 const anchor=document.createElement('i');anchor.className='meteor-trail-anchor';line.appendChild(anchor);
 line.addEventListener('animationstart',event=>{if(event.animationName==='meteorWishFly')leaveMeteorTrail(line,anchor);},{once:true});
 line.dataset.origin=chosen.origin;
 if(chosen.sourceId)line.dataset.sourceId=chosen.sourceId;
 line.style.setProperty('--lane-y',(top+lane*(bottom-top)/Math.max(1,lanes-1))+'px');
 line.style.setProperty('--wish-color',['#fff0bd','#d1f5df','#f9d7df','#d4eaff'][wishBatch%4]);
 (far?distantDanmaku:danmaku).appendChild(line);
 const duration=(innerWidth+line.offsetWidth+160)/100;
 const start=reduced?now:Math.max(now,laneReady[lane]||0),delay=(start-now)/1000;
 laneReady[lane]=start+(line.offsetWidth+260)/100*1000;
 line.style.setProperty('--fly-time',duration+'s');line.style.setProperty('--fly-delay',delay+'s');
 line.addEventListener('animationend',()=>line.remove(),{once:true});
 setTimeout(()=>line.remove(),reduced?7000:(delay+duration)*1000+200);
 wishBatch++;document.getElementById('light').textContent='✦ 再许一个愿望';
 wishStatus.textContent='第'+wishBatch+'份好运祝福已送达，愿你万事胜意。';
}
